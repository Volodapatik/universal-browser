<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Универсальный Браузер</title>
    
    <!-- Firebase не нужен - используем чистый OAuth 2.0 -->
    
    <style>
        /* Все стили из вашего кода сохраняются */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #0f0f0f; color: #fff; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #ff0000, #cc0000); padding: 15px 20px; }
        .header-content { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-text { font-size: 20px; font-weight: 600; }
        .auth-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        
        /* Модальное окно */
        .auth-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; }
        .auth-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; }
        
        /* Кнопки авторизации */
        .auth-options { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .auth-option-btn { padding: 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-option-btn:hover { transform: translateY(-2px); }
        .btn-google { background: #4285f4; color: white; }
        .btn-quick { background: linear-gradient(135deg, #34A853, #0F9D58); color: white; }
        
        /* Профиль пользователя */
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; background-size: cover; background-position: center; border: 2px solid #ff4444; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-email { font-size: 11px; color: #aaa; }
        
        /* Остальные ваши стили */
        .mode-switcher { display: flex; gap: 8px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 25px; }
        .mode-btn { padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer; background: transparent; color: rgba(255,255,255,0.7); }
        .mode-btn.active { background: rgba(255,255,255,0.2); color: white; }
        
        .search-section { padding: 20px; background: #202020; }
        .search-container { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
        .search-input { flex: 1; padding: 14px 20px; border: none; border-radius: 25px; background: #121212; color: white; font-size: 16px; }
        .search-btn { padding: 14px 30px; background: #ff4444; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: 600; }
        
        .results-container { padding: 20px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .video-card { background: #202020; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s; }
        .video-card:hover { transform: translateY(-5px); }
        .video-thumbnail { width: 100%; height: 180px; object-fit: cover; }
        .video-info { padding: 15px; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🎬</div>
                <div class="logo-text">Универсальный Браузер</div>
            </div>
            <div class="header-right">
                <div class="mode-switcher">
                    <button class="mode-btn active" onclick="switchMode('browser')">🔍 Поиск</button>
                    <button class="mode-btn" onclick="switchMode('youtube')">📺 YouTube</button>
                </div>
                <div id="authSection">
                    <button class="auth-btn" onclick="showAuthModal()">Войти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Введите поисковый запрос..." value="музыка">
            <button class="search-btn" onclick="performSearch()">🔍 Найти</button>
        </div>
    </section>

    <!-- Results -->
    <div class="results-container" id="results">
        <div class="video-grid">
            <!-- Результаты будут здесь -->
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-content">
            <button onclick="hideAuthModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#aaa; font-size:20px; cursor:pointer;">×</button>
            
            <h2 style="text-align:center; margin-bottom:20px;">Вход в систему</h2>
            
            <div class="auth-options">
                <button class="auth-option-btn btn-google" onclick="googleOAuthLogin()">
                    <span>🔐</span>
                    <span>Войти через Google</span>
                </button>
                
                <button class="auth-option-btn btn-quick" onclick="quickLocalAuth()">
                    <span>⚡</span>
                    <span>Быстрый вход</span>
                </button>
            </div>
            
            <div id="loginError" style="margin-top:20px; min-height:50px;"></div>
            
            <div style="margin-top:20px; padding:15px; background:#252525; border-radius:10px; font-size:12px; color:#aaa;">
                <strong>✅ OAuth настроен!</strong><br>
                Client ID: <code style="font-size:10px;">228878747798-e8j3nprs...</code>
            </div>
        </div>
    </div>

    <script>
        // 🔥 ОСНОВНЫЕ КОНФИГУРАЦИИ
        const SEARCH_API_KEY = "AIzaSyClSXPxjAzchdDLnUQtsqpObaWMjaCpVsc";
        const SEARCH_ENGINE_ID = "941011482ddeb4a66";
        const YOUTUBE_API_KEY = "AIzaSyCSeZzG1u99LqcTpm78P3-XSg4poOQEVCo";

        // 🔐 ВАШИ OAuth 2.0 ДАННЫЕ
        const OAUTH_CLIENT_ID = "228878747798-e8j3nprs785rsalu8gns1hlq6goeb42q.apps.googleusercontent.com";
        const OAUTH_REDIRECT_URI = window.location.origin + "/";
        const OAUTH_SCOPE = "profile email";

        let currentUser = null;

        // 🎯 ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
        window.addEventListener('load', function() {
            console.log("🚀 Запуск Универсального Браузера...");
            
            // Проверяем сохраненного пользователя
            const savedUser = localStorage.getItem('universalBrowserUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                updateAuthUI();
            }
            
            // Проверяем OAuth токен в URL
            checkOAuthResponse();
            
            // Инициализируем поиск
            initSearch();
            
            // Показываем уведомление о успешной настройке
            setTimeout(() => {
                showNotification("✅ OAuth 2.0 настроен и готов к работе!");
            }, 1000);
        });

        // 🔐 GOOGLE OAuth 2.0 АВТОРИЗАЦИЯ
        function googleOAuthLogin() {
            const authUrl = new URL('https://accounts.google.com/o/oauth2/v2/auth');
            
            const params = {
                client_id: OAUTH_CLIENT_ID,
                redirect_uri: OAUTH_REDIRECT_URI,
                response_type: 'token',
                scope: OAUTH_SCOPE,
                prompt: 'select_account',
                state: 'google_oauth_' + Date.now()
            };
            
            Object.keys(params).forEach(key => 
                authUrl.searchParams.append(key, params[key])
            );
            
            // Перенаправляем на страницу авторизации Google
            window.location.href = authUrl.toString();
        }

        // 🔍 ПРОВЕРКА OAuth ОТВЕТА
        function checkOAuthResponse() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            const accessToken = params.get('access_token');
            const error = params.get('error');
            
            if (error) {
                showNotification(`❌ Ошибка OAuth: ${error}`);
                return;
            }
            
            if (accessToken) {
                // Получаем информацию о пользователе
                fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                })
                .then(response => response.json())
                .then(userInfo => {
                    console.log("Google OAuth успешно:", userInfo);
                    
                    currentUser = {
                        id: userInfo.sub,
                        name: userInfo.name,
                        email: userInfo.email,
                        avatar: userInfo.picture,
                        provider: 'google',
                        accessToken: accessToken
                    };
                    
                    saveUser(currentUser);
                    updateAuthUI();
                    showNotification(`✅ Успешный вход через Google!`);
                    
                    // Очищаем URL от токена
                    window.history.replaceState({}, document.title, window.location.pathname);
                })
                .catch(error => {
                    console.error("Ошибка получения данных пользователя:", error);
                    showNotification("⚠️ Ошибка авторизации");
                });
            }
        }

        // ⚡ БЫСТРЫЙ ЛОКАЛЬНЫЙ ВХОД
        function quickLocalAuth() {
            const demoUsers = [
                { name: "Алексей Петров", email: "alexey@universal-browser.com", avatar: "https://i.pravatar.cc/150?img=1" },
                { name: "Мария Иванова", email: "maria@universal-browser.com", avatar: "https://i.pravatar.cc/150?img=2" },
                { name: "Дмитрий Смирнов", email: "dmitry@universal-browser.com", avatar: "https://i.pravatar.cc/150?img=3" },
                { name: "Анна Кузнецова", email: "anna@universal-browser.com", avatar: "https://i.pravatar.cc/150?img=4" }
            ];
            
            const user = demoUsers[Math.floor(Math.random() * demoUsers.length)];
            currentUser = {
                id: 'local_' + Date.now(),
                name: user.name,
                email: user.email,
                avatar: user.avatar,
                provider: 'local'
            };
            
            saveUser(currentUser);
            hideAuthModal();
            showNotification(`👋 Добро пожаловать, ${user.name}!`);
        }

        // 💾 СОХРАНЕНИЕ ПОЛЬЗОВАТЕЛЯ
        function saveUser(user) {
            currentUser = user;
            localStorage.setItem('universalBrowserUser', JSON.stringify(user));
            updateAuthUI();
        }

        // 🎨 ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            
            if (currentUser) {
                authSection.innerHTML = `
                    <div class="user-profile">
                        <div class="user-avatar" style="background-image: url('${currentUser.avatar}')"></div>
                        <div class="user-info">
                            <div class="user-name">${currentUser.name}</div>
                            <div class="user-email">${currentUser.email}</div>
                        </div>
                        <button onclick="logout()" style="
                            background: transparent;
                            color: #ff4444;
                            border: none;
                            cursor: pointer;
                            padding: 5px 10px;
                            border-radius: 5px;
                            font-size: 12px;
                        ">
                            Выйти
                        </button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `<button class="auth-btn" onclick="showAuthModal()">Войти</button>`;
            }
        }

        // 🎪 ПОКАЗ МОДАЛЬНОГО ОКНА
        function showAuthModal() {
            document.getElementById('authModal').style.display = 'block';
            
            document.getElementById('loginError').innerHTML = `
                <div style="text-align:center; color:#aaa; font-size:13px; margin-top:10px;">
                    ✅ OAuth Client ID настроен
                </div>
            `;
        }

        function hideAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        // 🚪 ВЫХОД
        function logout() {
            if (currentUser?.provider === 'google') {
                // Для Google выхода редиректим на страницу выхода
                window.location.href = 'https://accounts.google.com/Logout';
            }
            
            currentUser = null;
            localStorage.removeItem('universalBrowserUser');
            updateAuthUI();
            showNotification('👋 Вы вышли из системы');
        }

        // 📱 ОСНОВНЫЕ ФУНКЦИИ ПРИЛОЖЕНИЯ
        function initSearch() {
            switchMode('browser');
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
        }

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'browser') {
                document.getElementById('searchInput').placeholder = "Поиск в интернете...";
                document.getElementById('modeInfo').textContent = "Режим: Поиск";
                document.getElementById('youtubeNav').style.display = 'none';
            } else {
                document.getElementById('searchInput').placeholder = "Поиск YouTube видео...";
                document.getElementById('modeInfo').textContent = "Режим: YouTube";
                document.getElementById('youtubeNav').style.display = 'flex';
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            
            showNotification(`🔍 Поиск: "${query}"`);
            
            // Ваш код поиска...
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="video-grid">
                    <div class="video-card">
                        <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" class="video-thumbnail">
                        <div class="video-info">
                            <div class="video-title">Результаты поиска для: ${query}</div>
                            <div style="color:#aaa; font-size:14px;">OAuth настроен успешно!</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff4444;
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                z-index: 10000;
                font-weight: 500;
                animation: slideIn 0.3s ease-out;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => notification.remove(), 300);
            }, 2700);
            
            // Добавляем стили анимации
            if (!document.querySelector('#notification-styles')) {
                const style = document.createElement('style');
                style.id = 'notification-styles';
                style.textContent = `
                    @keyframes slideIn {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes slideOut {
                        from { transform: translateX(0); opacity: 1; }
                        to { transform: translateX(100%); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
        }

        // 📊 ДОБАВЛЯЕМ ИНФОРМАЦИЮ О OAUTH В ИНТЕРФЕЙС
        function showOAuthStatus() {
            const statusDiv = document.createElement('div');
            statusDiv.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #1a1a1a;
                color: #34A853;
                padding: 10px 15px;
                border-radius: 10px;
                font-size: 12px;
                border: 1px solid #34A853;
                z-index: 999;
            `;
            statusDiv.innerHTML = `
                🔐 OAuth 2.0 активен<br>
                <span style="font-size:10px; color:#aaa;">Client ID: ${OAUTH_CLIENT_ID.substring(0, 25)}...</span>
            `;
            document.body.appendChild(statusDiv);
            
            setTimeout(() => statusDiv.remove(), 5000);
        }

        // Показываем статус при загрузке
        setTimeout(showOAuthStatus, 1500);
    </script>
</body>
</html>
