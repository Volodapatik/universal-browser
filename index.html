<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Универсальный Браузер</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(255, 0, 0, 0.3);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
        }

        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .auth-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            background: #252525;
            border-radius: 10px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: #ff4444;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #ff4444;
        }

        .auth-submit {
            width: 100%;
            padding: 12px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-submit:hover {
            background: #ff6666;
        }

        .auth-divider {
            text-align: center;
            margin: 20px 0;
            color: #666;
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #333;
        }

        .auth-divider span {
            background: #1a1a1a;
            padding: 0 15px;
        }

        .google-auth {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .google-auth:hover {
            background: #5390f5;
        }

        .auth-error {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
        }

        .close-auth {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .mode-switcher {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .mode-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .youtube-nav {
            background: #202020;
            padding: 10px 20px;
            border-bottom: 1px solid #303030;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .youtube-nav-btn {
            padding: 8px 16px;
            background: #373737;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .youtube-nav-btn.active {
            background: white;
            color: black;
        }

        .youtube-nav-btn:hover {
            background: #505050;
        }

        .search-section {
            padding: 15px 20px;
            background: #202020;
            border-bottom: 1px solid #303030;
        }

        .search-container {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #121212;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #ff4444;
            background: #1a1a1a;
        }

        .search-input::placeholder {
            color: #aaaaaa;
        }

        .search-btn {
            padding: 12px 24px;
            background: #ff4444;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #ff6666;
            transform: translateY(-1px);
        }

        .status-bar {
            padding: 10px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #303030;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #aaaaaa;
        }

        .status-success {
            color: #44ff44;
        }

        .results-container {
            padding: 15px;
            min-height: 500px;
        }

        .video-card {
            background: #202020;
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid #303030;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }

        .video-thumbnail-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #303030;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .youtube-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff0000;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subscribe-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .subscribe-btn.subscribed {
            background: #303030;
            color: #aaa;
        }

        .subscribe-btn:hover {
            background: #ff6666;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }

        .browser-result {
            background: #202020;
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #303030;
            transition: all 0.3s;
            cursor: pointer;
        }

        .browser-result:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 15px rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
        }

        .result-title {
            color: #8ab4f8;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .result-url {
            color: #34a853;
            font-size: 12px;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .result-snippet {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.4;
        }

        .channel-card {
            background: #202020;
            margin: 10px 0;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #303030;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .channel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }

        .channel-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #303030;
        }

        .channel-info {
            flex: 1;
        }

        .channel-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .channel-stats {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .channel-description {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-item {
            background: #202020;
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #303030;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            gap: 15px;
        }

        .history-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 15px rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
        }

        .history-thumbnail {
            width: 120px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: #303030;
        }

        .history-info {
            flex: 1;
        }

        .history-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .history-channel {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .load-more-container {
            text-align: center;
            padding: 20px;
            margin-top: 10px;
        }

        .load-more-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .load-more-btn:hover {
            background: #ff6666;
            transform: translateY(-2px);
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
        }

        #video-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-controls-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1001;
            pointer-events: none;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #aaaaaa;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #303030;
            border-top: 4px solid #ff4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaaaaa;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            background: #303030;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #404040;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 10px;
            }
            
            .header-right {
                width: 100%;
                justify-content: center;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .search-btn {
                width: 100%;
            }
            
            .mode-switcher {
                width: 100%;
                justify-content: center;
            }
            
            .video-thumbnail-container {
                height: 180px;
            }
            
            .channel-card {
                flex-direction: column;
                text-align: center;
            }
            
            .history-item {
                flex-direction: column;
            }
            
            .history-thumbnail {
                width: 100%;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🎬</div>
                <div class="logo-text">Универсальный Браузер</div>
            </div>
            
            <div class="header-right">
                <!-- Mode Switcher -->
                <div class="mode-switcher">
                    <button class="mode-btn active" id="browserMode" onclick="switchMode('browser')">
                        🔍 Поиск
                    </button>
                    <button class="mode-btn" id="youtubeMode" onclick="switchMode('youtube')">
                        📺 YouTube
                    </button>
                </div>

                <!-- Auth Section -->
                <div id="authSection">
                    <button class="auth-btn" onclick="showAuthModal()">Войти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube Navigation -->
    <div class="youtube-nav" id="youtubeNav" style="display: none;">
        <button class="youtube-nav-btn active" onclick="switchYouTubeTab('search')">🔍 Поиск</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('history')">📚 История</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('subscriptions')">⭐ Подписки</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('channels')">📺 Каналы</button>
    </div>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" 
                   placeholder="Введите поисковый запрос..." value="музыка">
            <button class="search-btn" onclick="performSearch()">
                🔍 Найти
            </button>
        </div>
    </section>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-success" id="statusText">✅ Готов к работе</div>
        <div class="api-info" id="modeInfo">Режим: Поиск</div>
    </div>

    <!-- Results -->
    <div class="results-container" id="results">
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Выберите режим и введите запрос</h3>
            <p>Начните поиск в интернете или на YouTube</p>
            
            <div class="quick-actions">
                <button class="quick-btn" onclick="searchQuick('техно музыка')">🎵 Техно</button>
                <button class="quick-btn" onclick="searchQuick('lofi hip hop')">🎶 Lo-Fi</button>
                <button class="quick-btn" onclick="searchQuick('jazz')">🎷 Джаз</button>
                <button class="quick-btn" onclick="searchQuick('фонк')">🔥 Фонк</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-content">
            <button class="close-auth" onclick="hideAuthModal()">×</button>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <!-- Login Form -->
            <div class="auth-form active" id="loginForm">
                <div class="form-group">
                    <input type="email" class="form-input" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="loginPassword" placeholder="Пароль" required>
                </div>
                <button class="auth-submit" onclick="loginWithEmail()">Войти</button>
                
                <div class="auth-divider">
                    <span>или</span>
                </div>
                
                <button class="google-auth" onclick="loginWithGoogle()">
                    <span>Войти через Google</span>
                </button>
                
                <div class="auth-error" id="loginError"></div>
            </div>

            <!-- Register Form -->
            <div class="auth-form" id="registerForm">
                <div class="form-group">
                    <input type="text" class="form-input" id="registerName" placeholder="Имя" required>
                </div>
                <div class="form-group">
                    <input type="email" class="form-input" id="registerEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="registerPassword" placeholder="Пароль" required>
                </div>
                <button class="auth-submit" onclick="registerWithEmail()">Зарегистрироваться</button>
                
                <div class="auth-divider">
                    <span>или</span>
                </div>
                
                <button class="google-auth" onclick="loginWithGoogle()">
                    <span>Войти через Google</span>
                </button>
                
                <div class="auth-error" id="registerError"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Video Player -->
    <div class="video-container" id="videoContainer">
        <iframe 
            id="video-player" 
            frameborder="0" 
            allowfullscreen
            allow="autoplay; encrypted-media"
        ></iframe>
        <div class="video-controls-overlay">
            <button class="back-btn" onclick="closeVideo()">← Назад к поиску</button>
        </div>
    </div>

        function addToHistory(videoId, title, channel, thumbnail) {
            const existingIndex = watchHistory.findIndex(item => item.videoId === videoId);
            
            if (existingIndex !== -1) {
                watchHistory[existingIndex].watchedAt = new Date().toISOString();
            } else {
                watchHistory.push({
                    videoId,
                    title,
                    channel,
                    thumbnail,
                    watchedAt: new Date().toISOString()
                });
            }
            
            if (watchHistory.length > 100) {
                watchHistory = watchHistory.slice(-100);
            }
            
            saveUserData();
        }

        function toggleSubscription(channelId, channelTitle = '', channelThumbnail = '') {
            const existingSub = subscriptions.find(sub => sub.id === channelId);
            
            if (existingSub) {
                subscriptions = subscriptions.filter(sub => sub.id !== channelId);
                showNotification(`❌ Отписались от канала "${existingSub.title}"`);
            } else {
                subscriptions.push({
                    id: channelId,
                    title: channelTitle,
                    thumbnail: channelThumbnail
                });
                showNotification(`✅ Подписались на канал "${channelTitle}"`);
            }
            
            saveUserData();
        }

        async function searchWeb(query) {
            const url = `https://www.googleapis.com/customsearch/v1?key=${SEARCH_API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    displayBrowserResults(data.items, query);
                } else {

            } catch (error) {

        async function searchYouTubeVideos(query) {
            const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
            
            try {
                const searchResponse = await fetch(searchUrl);
                const searchData = await searchResponse.json();
                
                if (searchData.items && searchData.items.length > 0) {
                    const videoIds = searchData.items.map(item => item.id.videoId).join(',');
                    const videosUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,statistics&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
                    const videosResponse = await fetch(videosUrl);
                    const videosData = await videosResponse.json();
                    
                    displayYouTubeResults(videosData.items, query);
                } else {
                    showNoResults(query);
                }
            } catch (error) {
                showError(`Ошибка YouTube: ${error.message}`);
            }
        }

        function displayYouTubeResults(videos, query) {
            const resultsDiv = document.getElementById('results');

                    📺 Найдено YouTube видео: ${videos.length}

            html += videos.map(video => {
                const duration = formatDuration(video.contentDetails?.duration);
                const viewCount = formatViews(video.statistics?.viewCount);
                const publishedAt = formatDate(video.snippet.publishedAt);
                
                return `
                    <div class="video-card" onclick="playYouTubeVideo('${video.id}')">
                        <div class="video-thumbnail-container">
                            <img src="${video.snippet.thumbnails.medium.url}" class="video-thumbnail" alt="${video.snippet.title}">

        function formatDuration(duration) {
            if (!duration) return '--:--';
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            if (!match) return '--:--';
            
            const hours = (match[1] || '').replace('H', '');
            const minutes = (match[2] || '').replace('M', '');
            const seconds = (match[3] || '').replace('S', '');
            
            if (hours) {
                return `${hours}:${minutes.padStart(2, '0')}:${seconds.padStart(2, '0')}`;
            } else {
                return `${minutes}:${seconds.padStart(2, '0')}`;
            }
        }

        function formatViews(viewCount) {
            if (!viewCount) return '0';
            const count = parseInt(viewCount);
            if (count >= 1000000) {
                return (count / 1000000).toFixed(1) + 'M';
            } else if (count >= 1000) {
                return (count / 1000).toFixed(1) + 'K';
            }
            return count.toString();
        }

        function formatDate(publishedAt) {
            const date = new Date(publishedAt);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Сегодня';
            if (diffDays === 1) return 'Вчера';
            if (diffDays < 7) return `${diffDays} дней назад`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} нед. назад`;
            return `${Math.floor(diffDays / 30)} мес. назад`;
        }
