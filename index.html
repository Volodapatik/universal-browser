<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Permissions-Policy" content="autoplay=*">
    <title>🎬 Универсальный Браузер</title>
    
    <!-- Firebase (только для истории и подписок в localStorage) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    
    <style>
        /* ВСЕ ТВОИ СТИЛИ ОСТАЮТСЯ БЕЗ ИЗМЕНЕНИЙ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(255, 0, 0, 0.3);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
        }

        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .auth-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            background: #252525;
            border-radius: 10px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: #ff4444;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #ff4444;
        }

        .auth-submit {
            width: 100%;
            padding: 12px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-submit:hover {
            background: #ff6666;
        }

        .auth-divider {
            text-align: center;
            margin: 20px 0;
            color: #666;
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #333;
        }

        .auth-divider span {
            background: #1a1a1a;
            padding: 0 15px;
        }

        .google-auth {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .google-auth:hover {
            background: #5390f5;
        }

        .auth-error {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
        }

        .close-auth {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .mode-switcher {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .mode-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .youtube-nav {
            background: #202020;
            padding: 10px 20px;
            border-bottom: 1px solid #303030;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .youtube-nav-btn {
            padding: 8px 16px;
            background: #373737;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .youtube-nav-btn.active {
            background: white;
            color: black;
        }

        .youtube-nav-btn:hover {
            background: #505050;
        }

        .search-section {
            padding: 15px 20px;
            background: #202020;
            border-bottom: 1px solid #303030;
        }

        .search-container {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #121212;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #ff4444;
            background: #1a1a1a;
        }

        .search-input::placeholder {
            color: #aaaaaa;
        }

        .search-btn {
            padding: 12px 24px;
            background: #ff4444;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #ff6666;
            transform: translateY(-1px);
        }

        .status-bar {
            padding: 10px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #303030;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #aaaaaa;
        }

        .status-success {
            color: #44ff44;
        }

        .results-container {
            padding: 15px;
            min-height: 500px;
        }

        .video-card {
            background: #202020;
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid #303030;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }

        .video-thumbnail-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #303030;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .youtube-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff0000;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subscribe-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .subscribe-btn.subscribed {
            background: #303030;
            color: #aaa;
        }

        .subscribe-btn:hover {
            background: #ff6666;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }

        .browser-result {
            background: #202020;
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #303030;
            transition: all 0.3s;
            cursor: pointer;
        }

        .browser-result:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 15px rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
        }

        .result-title {
            color: #8ab4f8;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .result-url {
            color: #34a853;
            font-size: 12px;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .result-snippet {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.4;
        }

        .channel-card {
            background: #202020;
            margin: 10px 0;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #303030;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .channel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }

        .channel-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #303030;
        }

        .channel-info {
            flex: 1;
        }

        .channel-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .channel-stats {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .channel-description {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-item {
            background: #202020;
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #303030;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            gap: 15px;
        }

        .history-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 15px rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
        }

        .history-thumbnail {
            width: 120px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: #303030;
        }

        .history-info {
            flex: 1;
        }

        .history-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .history-channel {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .load-more-container {
            text-align: center;
            padding: 20px;
            margin-top: 10px;
        }

        .load-more-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .load-more-btn:hover {
            background: #ff6666;
            transform: translateY(-2px);
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
        }

        #video-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-controls-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1001;
            pointer-events: none;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #aaaaaa;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #303030;
            border-top: 4px solid #ff4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaaaaa;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            background: #303030;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #404040;
        }

        .channel-header {
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .channel-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }

        .channel-info-large {
            flex: 1;
        }

        .channel-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .channel-stats-large {
            display: flex;
            gap: 15px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .channel-description-full {
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .filters-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            background: #303030;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #ff4444;
        }

        .filter-btn:hover {
            background: #404040;
        }

        .live-badge {
            background: #ff4444;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .back-to-search {
            background: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .back-to-search:hover {
            background: #555;
        }

        /* Для бесконечной ленты */
        .scroll-observer {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .scroll-observer.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .observer-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #303030;
            border-top: 3px solid #ff4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .no-more-results {
            text-align: center;
            color: #666;
            padding: 20px;
            font-style: italic;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 10px;
            }
            
            .header-right {
                width: 100%;
                justify-content: center;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .search-btn {
                width: 100%;
            }
            
            .mode-switcher {
                width: 100%;
                justify-content: center;
            }
            
            .video-thumbnail-container {
                height: 180px;
            }
            
            .channel-card {
                flex-direction: column;
                text-align: center;
            }
            
            .history-item {
                flex-direction: column;
            }
            
            .history-thumbnail {
                width: 100%;
                height: 150px;
            }
            
            .channel-header {
                flex-direction: column;
                text-align: center;
            }
            
            .channel-stats-large {
                justify-content: center;
            }
            
            .video-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1025px) {
            .video-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🎬</div>
                <div class="logo-text">Универсальный Браузер</div>
            </div>
            
            <div class="header-right">
                <div class="mode-switcher">
                    <button class="mode-btn active" id="browserMode" onclick="switchMode('browser')">
                        🔍 Поиск
                    </button>
                    <button class="mode-btn" id="youtubeMode" onclick="switchMode('youtube')">
                        📺 YouTube
                    </button>
                </div>

                <div id="authSection">
                    <button class="auth-btn" onclick="showAuthModal()">Войти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube Navigation -->
    <div class="youtube-nav" id="youtubeNav" style="display: none;">
        <button class="youtube-nav-btn active" onclick="switchYouTubeTab('search')">🔍 Поиск</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('history')">📚 История</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('subscriptions')">⭐ Подписки</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('channels')">📺 Каналы</button>
        <button class="youtube-nav-btn" onclick="switchYouTubeTab('trending')">🔥 Тренды</button>
    </div>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" 
                   placeholder="Введите поисковый запрос..." value="музыка">
            <button class="search-btn" onclick="performSearch()">
                🔍 Найти
            </button>
        </div>
    </section>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-success" id="statusText">✅ Готов к работе</div>
        <div class="api-info" id="modeInfo">Режим: Поиск</div>
    </div>

    <!-- Results -->
    <div class="results-container" id="results">
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Выберите режим и введите запрос</h3>
            <p>Начните поиск в интернете или на YouTube</p>
            
            <div class="quick-actions">
                <button class="quick-btn" onclick="searchQuick('техно музыка')">🎵 Техно</button>

        // 🔥 ОСНОВНЫЕ КОНФИГУРАЦИИ

        // 📺 ИСПРАВЛЕННЫЙ YOUTUBE PLAYER
        function playYouTubeVideo(videoId) {
            currentVideoId = videoId;
            const videoContainer = document.getElementById('videoContainer');
            videoContainer.style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            const videoElement = document.querySelector(`[onclick="playYouTubeVideo('${videoId}')"]`);
            const title = videoElement?.querySelector('.video-title')?.textContent || 'Неизвестное видео';
            const channel = videoElement?.querySelector('.video-channel span')?.textContent?.replace('📺 ', '') || 'Неизвестный канал';
            const thumbnail = videoElement?.querySelector('.video-thumbnail')?.src || '';
            
            addToHistory(videoId, title, channel, thumbnail);
            
            if (ytPlayer) {
                ytPlayer.loadVideoById(videoId);
                ytPlayer.playVideo();
            } else {
                loadYouTubePlayer(videoId);
            }
        }

        function loadYouTubePlayer(videoId) {
            const playerContainer = document.getElementById('video-player');
            
            const iframe = document.createElement('iframe');
            iframe.id = 'youtube-iframe';
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1`;
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            iframe.title = 'YouTube video player';
            
            playerContainer.innerHTML = '';
            playerContainer.appendChild(iframe);
            
            if (typeof YT === 'undefined') {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                
                window.onYouTubeIframeAPIReady = function() {
                    ytPlayer = new YT.Player('youtube-iframe', {
                        events: {
                            'onReady': onPlayerReady,
                            'onStateChange': onPlayerStateChange
                        }
                    });
                };
            } else {
                ytPlayer = new YT.Player('youtube-iframe', {
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            // Можно добавить обработку событий плеера
        }

        function closeVideo() {
            const videoContainer = document.getElementById('videoContainer');
            videoContainer.style.display = 'none';
            document.body.style.overflow = 'auto';
            
            if (ytPlayer && ytPlayer.stopVideo) {
                ytPlayer.stopVideo();
            }
        }

        // 💾 УПРАВЛЕНИЕ ДАННЫМИ
        function addToHistory(videoId, title, channel, thumbnail) {
            const existingIndex = watchHistory.findIndex(item => item.videoId === videoId);
            
            if (existingIndex !== -1) {
                watchHistory[existingIndex].watchedAt = new Date().toISOString();
            } else {
                watchHistory.push({
                    videoId,
                    title,
                    channel,
                    thumbnail,
                    watchedAt: new Date().toISOString()
                });
            }
            
            if (watchHistory.length > 100) {
                watchHistory = watchHistory.slice(-100);
            }
            
            localStorage.setItem('youtubeHistory', JSON.stringify(watchHistory));
        }

        function toggleSubscription(channelId, channelTitle = '', channelThumbnail = '', event) {
            if (event) event.stopPropagation();
            
            const existingSub = subscriptions.find(sub => sub.id === channelId);
            
            if (existingSub) {
                subscriptions = subscriptions.filter(sub => sub.id !== channelId);
                showNotification(`❌ Отписались от канала "${existingSub.title}"`);
            } else {
                subscriptions.push({
                    id: channelId,
                    title: channelTitle,
                    thumbnail: channelThumbnail
                });
                showNotification(`✅ Подписались на канал "${channelTitle}"`);
            }
            
            localStorage.setItem('youtubeSubscriptions', JSON.stringify(subscriptions));
            
            const subscribeBtns = document.querySelectorAll(`button[onclick*="toggleSubscription('${channelId}'"]`);
            subscribeBtns.forEach(btn => {
                const isNowSubscribed = subscriptions.some(sub => sub.id === channelId);
                btn.textContent = isNowSubscribed ? '✅ Подписан' : '🔔 Подписаться';
                btn.classList.toggle('subscribed', isNowSubscribed);
            });
        }

        // 📺 БЕСКОНЕЧНАЯ ЛЕНТА YOUTUBE
        async function searchYouTubeVideos(query, loadMore = false) {
            if (isLoadingMore) return;
            
            if (!loadMore) {
                currentSearchQuery = query;
                youtubeNextPageToken = '';
                hasMoreResults = true;
                showLoading(`Ищем "${query}" на YouTube...`);
            } else {
                if (!youtubeNextPageToken || !hasMoreResults) return;
                isLoadingMore = true;
                showScrollObserver();
            }
            
            try {
                let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
                
                if (youtubeNextPageToken) {
                    url += `&pageToken=${youtubeNextPageToken}`;
                }
                
                const searchResponse = await fetch(url);
                const searchData = await searchResponse.json();
                
                if (searchData.items && searchData.items.length > 0) {
                    const videoIds = searchData.items.map(item => item.id.videoId).join(',');
                    const videosUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,statistics&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
                    const videosResponse = await fetch(videosUrl);
                    const videosData = await videosResponse.json();
                    
                    if (loadMore) {
                        displayYouTubeResults(videosData.items, query, true);
                        hideScrollObserver();
                    } else {
                        displayYouTubeResults(videosData.items, query, false);
                    }
                    
                    youtubeNextPageToken = searchData.nextPageToken || '';
                    hasMoreResults = !!searchData.nextPageToken;
                } else {
                    if (!loadMore) {
                        showNoResults(query);
                    } else {
                        showNoMoreResults();
                    }
                }
            } catch (error) {
                showError(`Ошибка YouTube: ${error.message}`);
            } finally {
                isLoadingMore = false;
            }
        }

        function displayYouTubeResults(videos, query, append = false) {
            const resultsDiv = document.getElementById('results');
            
            if (!append) {
                let html = `
                    <div style="color: #aaa; font-size: 14px; margin-bottom: 15px; padding: 0 10px;">
                        📺 Найдено видео по запросу: "${query}"
                    </div>
                    <div class="video-grid" id="youtubeVideos">
                `;
                resultsDiv.innerHTML = html;
            }
            
            const videosGrid = document.getElementById('youtubeVideos') || resultsDiv;
            
            videos.forEach(video => {
                const duration = formatDuration(video.contentDetails?.duration);
                const viewCount = formatViews(video.statistics?.viewCount);
                const publishedAt = formatDate(video.snippet.publishedAt);
                
                videosGrid.innerHTML += `
                    <div class="video-card" onclick="playYouTubeVideo('${video.id}')">
                        <div class="video-thumbnail-container">
                            <img src="${video.snippet.thumbnails.medium.url}" class="video-thumbnail" alt="${video.snippet.title}">
                            <div class="youtube-badge">YouTube</div>
                            <div class="video-duration">${duration}</div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.snippet.title}</div>

                                <span>📺 ${video.snippet.channelTitle}</span>
                                <button class="subscribe-btn" onclick="toggleSubscription('${video.snippet.channelId}', '${video.snippet.channelTitle}', '${video.snippet.thumbnails.default.url}', event)">
                                    ${subscriptions.some(sub => sub.id === video.snippet.channelId) ? '✅ Подписан' : '🔔 Подписаться'}
                                </button>
                            </div>
                            <div class="video-meta">
                                <span>👁️ ${viewCount}</span>
                                <span>📅 ${publishedAt}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            if (!append) {
                resultsDiv.innerHTML += `</div>`;
                
                if (hasMoreResults) {
                    resultsDiv.innerHTML += `
                        <div class="scroll-observer" id="scrollObserver">
                            <div class="observer-spinner"></div>
                        </div>
                    `;
                    setupScrollObserver();
                }
            }
            
            if (!hasMoreResults && videosGrid.querySelector('.scroll-observer')) {
                videosGrid.innerHTML += `<div class="no-more-results">Больше результатов нет</div>`;
                document.querySelector('.scroll-observer')?.remove();
            }
        }

        // 📺 КАНАЛЫ
        async function openChannel(channelId, channelTitle = '', channelThumbnail = '') {
            currentChannelId = channelId;
            
            try {
                const channelUrl = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelId}&key=${YOUTUBE_API_KEY}`;
                const channelResponse = await fetch(channelUrl);
                const channelData = await channelResponse.json();
                
                if (channelData.items && channelData.items.length > 0) {
                    currentChannelInfo = channelData.items[0];
                    await loadChannelContent('all', true);
                } else {
                    showError('Канал не найден');
                }
            } catch (error) {
                showError(`Ошибка загрузки канала: ${error.message}`);
            }
        }

        async function loadChannelContent(filter = 'all', reset = false) {
            if (!currentChannelId) return;
            
            if (reset) {
                channelNextPageToken = '';
            }
            
            showLoading(`Загрузка контента канала...`);
            
            try {
                let url = '';
                const baseParams = `part=snippet&channelId=${currentChannelId}&maxResults=20&key=${YOUTUBE_API_KEY}`;
                
                if (filter === 'live') {
                    url = `https://www.googleapis.com/youtube/v3/search?${baseParams}&type=video&eventType=live&order=date`;
                } else if (filter === 'videos') {
                    url = `https://www.googleapis.com/youtube/v3/search?${baseParams}&type=video&order=date`;
                } else {
                    url = `https://www.googleapis.com/youtube/v3/search?${baseParams}&type=video&order=date`;
                }
                
                if (channelNextPageToken) {
                    url += `&pageToken=${channelNextPageToken}`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const videoIds = data.items.map(item => item.id.videoId).join(',');
                    const videosUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,statistics,liveStreamingDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`;
                    const videosResponse = await fetch(videosUrl);
                    const videosData = await videosResponse.json();
                    
                    displayChannelContent(videosData.items, filter, reset);
                    channelNextPageToken = data.nextPageToken || '';
                } else {
                    showNoChannelContent();
                }
            } catch (error) {
                showError(`Ошибка загрузки контента: ${error.message}`);
            }
        }

        function displayChannelContent(videos, filter, reset) {
            const resultsDiv = document.getElementById('results');
            
            if (reset || !resultsDiv.querySelector('.channel-header')) {
                let html = `
                    <button class="back-to-search" onclick="backToSubscriptions()">
                        ← Назад к подпискам
                    </button>
                    
                    <div class="channel-header">
                        <img src="${currentChannelInfo.snippet.thumbnails.medium.url}" 
                             class="channel-avatar-large" 
                             alt="${currentChannelInfo.snippet.title}">
                        <div class="channel-info-large">
                            <div class="channel-title">${currentChannelInfo.snippet.title}</div>
                            <div class="channel-stats-large">
                                <span>👥 ${formatSubscribers(currentChannelInfo.statistics.subscriberCount)} подписчиков</span>
                                <span>📺 ${formatViews(currentChannelInfo.statistics.videoCount)} видео</span>
                                <span>👁️ ${formatViews(currentChannelInfo.statistics.viewCount)} просмотров</span>
                            </div>
                            <div class="channel-description-full">
                                ${currentChannelInfo.snippet.description || 'Описание отсутствует'}
                            </div>
                        </div>
                        <button class="subscribe-btn ${subscriptions.some(sub => sub.id === currentChannelId) ? 'subscribed' : ''}" 
                                onclick="toggleSubscription('${currentChannelId}', '${currentChannelInfo.snippet.title}', '${currentChannelInfo.snippet.thumbnails.default.url}', event)">
                            ${subscriptions.some(sub => sub.id === currentChannelId) ? '✅ Подписан' : '🔔 Подписаться'}
                        </button>
                    </div>
                    
                    <div class="filters-container">
                        <button class="filter-btn ${filter === 'all' ? 'active' : ''}" 
                                onclick="changeChannelFilter('all')">📹 Все видео</button>
                        <button class="filter-btn ${filter === 'videos' ? 'active' : ''}"

                                onclick="changeChannelFilter('live')">🔴 Трансляции</button>
                    </div>
                    
                    <div class="video-grid" id="channelVideos">
                `;
                
                resultsDiv.innerHTML = html;
            }
            
            const videosGrid = document.getElementById('channelVideos');
            
            videos.forEach(video => {
                const isLive = video.snippet.liveBroadcastContent === 'live';
                const duration = isLive ? 'LIVE' : formatDuration(video.contentDetails?.duration);
                const viewCount = formatViews(video.statistics?.viewCount);
                const publishedAt = formatDate(video.snippet.publishedAt);
                
                videosGrid.innerHTML += `
                    <div class="video-card" onclick="playYouTubeVideo('${video.id}')">
                        <div class="video-thumbnail-container">
                            <img src="${video.snippet.thumbnails.medium.url}" class="video-thumbnail" alt="${video.snippet.title}">
                            <div class="youtube-badge">YouTube</div>
                            <div class="video-duration ${isLive ? 'live-badge' : ''}">
                                ${isLive ? '🔴 LIVE' : duration}
                            </div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.snippet.title}</div>
                            <div class="video-meta">
                                <span>👁️ ${viewCount}</span>
                                <span>📅 ${publishedAt}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            if (channelNextPageToken && !resultsDiv.querySelector('.load-more-btn')) {
                resultsDiv.innerHTML += `
                    <button class="load-more-btn" onclick="loadChannelContent('${filter}')">

        function changeChannelFilter(newFilter) {
            currentContentFilter = newFilter;
            loadChannelContent(newFilter, true);

            currentChannelId = null;
            currentChannelInfo = null;
            channelNextPageToken = '';
            showSubscriptions();

        // 🔍 ПОИСК В ИНТЕРНЕТЕ

            const url = `https://www.googleapis.com/customsearch/v1?key=${SEARCH_API_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(query)}`;
            
            try {
                const response = await fetch(url);

                if (data.items && data.items.length > 0) {
                    displayBrowserResults(data.items, query);
                } else {
                    showNoResults(query);

            } catch (error) {
                showError('Ошибка поиска');
            }

            items.forEach((item) => {

                        <div class="result-snippet">${item.snippet}</div>

                        </div>
                        <button class="subscribe-btn subscribed" onclick="toggleSubscription('${channel.id}', '${channel.title}', '${channel.thumbnail}', event)">
                            ✅ Подписан
                        </button>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        function showChannelSearch() {
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📺</div>
                    <h3>Поиск каналов</h3>
                    <p>Введите название канала для поиска</p>
                    <div class="search-container" style="margin-top: 20px;">
                        <input type="text" class="search-input" id="channelSearchInput" 
                               placeholder="Введите название канала...">
                        <button class="search-btn" onclick="searchChannels()">
                            🔍 Найти каналы
                        </button>
                    </div>
                </div>
            `;
        }

        async function searchChannels() {
            const query = document.getElementById('channelSearchInput').value.trim();
            
            if (!query) {
                showError('Введите название канала');
                return;
            }

            showLoading(`Ищем каналы "${query}"...`);
            
            try {
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=channel&key=${YOUTUBE_API_KEY}`;
                const searchResponse = await fetch(searchUrl);
                const searchData = await searchResponse.json();
                
                if (searchData.items && searchData.items.length > 0) {
                    const channelIds = searchData.items.map(item => item.snippet.channelId).join(',');
                    const channelsUrl = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelIds}&key=${YOUTUBE_API_KEY}`;
                    const channelsResponse = await fetch(channelsUrl);
                    const channelsData = await channelsResponse.json();
                    
                    displayChannelSearchResults(channelsData.items, query);
                } else {
                    showNoResults(query);
                }
            } catch (error) {
                showError(`Ошибка поиска каналов: ${error.message}`);
            }
        }

        function displayChannelSearchResults(channels, query) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div style="color: #aaa; font-size: 14px; margin-bottom: 15px; padding: 0 10px;">
                    📺 Найдено каналов: ${channels.length}
                </div>
            `;
            
            html += channels.map(channel => {
                const isSubscribed = subscriptions.some(sub => sub.id === channel.id);
                
                return `
                    <div class="channel-card" onclick="openChannel('${channel.id}', '${channel.snippet.title}', '${channel.snippet.thumbnails.medium.url}')">
                        <img src="${channel.snippet.thumbnails.medium.url}" class="channel-avatar" alt="${channel.snippet.title}">
                        <div class="channel-info">
                            <div class="channel-name">${channel.snippet.title}</div>
                            <div class="channel-stats">
                                👥 ${formatSubscribers(channel.statistics.subscriberCount)} подписчиков • 
                                📺 ${formatViews(channel.statistics.videoCount)} видео
                            </div>
                            <div class="channel-description">
                                ${channel.snippet.description || 'Описание отсутствует'}
                            </div>
                        </div>
                        <button class="subscribe-btn ${isSubscribed ? 'subscribed' : ''}" 
                                onclick="toggleSubscription('${channel.id}', '${channel.snippet.title}', '${channel.snippet.thumbnails.default.url}', event)">
                            ${isSubscribed ? '✅ Подписан' : '🔔 Подписаться'}
                        </button>
                    </div>
                `;
            }).join('');
            
            resultsDiv.innerHTML = html;
        }

        // 🔧 ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        function switchMode(mode) {
            currentMode = mode;
            
            document.getElementById('browserMode').classList.toggle('active', mode === 'browser');
            document.getElementById('youtubeMode').classList.toggle('active', mode === 'youtube');
            
            const searchInput = document.getElementById('searchInput');
            const modeInfo = document.getElementById('modeInfo');
            const youtubeNav = document.getElementById('youtubeNav');
            
            if (mode === 'browser') {
                searchInput.placeholder = "Поиск в интернете...";
                modeInfo.textContent = "Режим: Поиск";
                youtubeNav.style.display = 'none';
                showEmptyState();
                removeScrollObserver();
            } else {
                searchInput.placeholder = "Поиск YouTube видео...";
                modeInfo.textContent = "Режим: YouTube";
                youtubeNav.style.display = 'flex';
                showEmptyYouTubeState();
            }
        }

        function showEmptyState() {
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <h3>Выберите режим и введите запрос</h3>
                    <p>Начните поиск в интернете или на YouTube</p>
                </div>
            `;
        }

        function showEmptyYouTubeState() {
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📺</div>
                    <h3>Введите запрос для поиска на YouTube</h3>
                    <p>Или перейдите в другие разделы</p>
                </div>
            `;
        }

        // 🔄 СИСТЕМА БЕСКОНЕЧНОЙ ПРОКРУТКИ
        function setupScrollObserver() {
            const observerElement = document.getElementById('scrollObserver');
            if (!observerElement || scrollObserver) return;
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && currentMode === 'youtube' && currentYouTubeTab === 'search') {
                        if (youtubeNextPageToken && hasMoreResults && !isLoadingMore) {
                            searchYouTubeVideos(currentSearchQuery, true);
                        }
                    }
                });
            }, {
                root: null,
                rootMargin: '100px',
                threshold: 0.1
            });
            
            observer.observe(observerElement);
            scrollObserver = observer;
        }

        function removeScrollObserver() {
            if (scrollObserver) {
                scrollObserver.disconnect();
                scrollObserver = null;
            }
        }

        function showScrollObserver() {
            const observer = document.getElementById('scrollObserver');
            if (observer) {
                observer.classList.remove('hidden');
            }
        }

        function hideScrollObserver() {
            const observer = document.getElementById('scrollObserver');
            if (observer) {
                observer.classList.add('hidden');
            }
        }

        function showNoMoreResults() {
            const resultsDiv = document.getElementById('results');
            if (!resultsDiv.querySelector('.no-more-results')) {
                resultsDiv.innerHTML += `<div class="no-more-results">Больше результатов нет</div>`;
            }
            hideScrollObserver();
        }

        function showNoChannelContent() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML += `
                <div class="empty-state">
                    <div class="empty-icon">📺</div>
                    <h3>Контент не найден</h3>
                    <p>На этом канале нет видео или трансляций</p>
                </div>
            `;
        }

        // 📱 ОСНОВНЫЕ ФУНКЦИИ ПОИСКА
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                showError('Введите поисковый запрос');
                return;
            }

            currentSearchQuery = query;
            removeScrollObserver();
            youtubeNextPageToken = '';
            hasMoreResults = true;
            
            try {
                if (currentMode === 'youtube') {
                    if (currentYouTubeTab === 'search') {
                        await searchYouTubeVideos(query);
                    } else {
                        showError('Перейдите в раздел "Поиск" для поиска видео');
                    }
                } else {
                    await searchWeb(query);
                }
            } catch (error) {
                showError(`Ошибка: ${error.message}`);
            }
        }

        function showLoading(query) {
            document.getElementById('results').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Ищем "${query}"${currentMode === 'youtube' ? ' на YouTube' : ''}...</p>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('results').innerHTML = `
                <div class="error">❌ ${message}</div>
            `;
        }

        function showNoResults(query) {
            document.getElementById('results').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <h3>По запросу "${query}" ничего не найдено</h3>
                    <p>Попробуйте изменить запрос</p>
                </div>
            `;
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff4444;
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                z-index: 10000;
                font-weight: 500;
                animation: slideIn 0.3s ease-out;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 2700);
        }

        // Стили для анимации уведомлений
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        function searchQuick(query) {
            document.getElementById('searchInput').value = query;
            performSearch();
        }

        function formatDuration(duration) {
            if (!duration) return '--:--';
            const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
            if (!match) return '--:--';
            
            const hours = (match[1] || '').replace('H', '');
            const minutes = (match[2] || '').replace('M', '');
            const seconds = (match[3] || '').replace('S', '');
            
            if (hours) {
                return `${hours}:${minutes.padStart(2, '0')}:${seconds.padStart(2, '0')}`;
            } else {
                return `${minutes}:${seconds.padStart(2, '0')}`;
            }
        }

        function formatViews(viewCount) {
            if (!viewCount) return '0';
            const count = parseInt(viewCount);
            if (count >= 1000000) {
                return (count / 1000000).toFixed(1) + 'M';
            } else if (count >= 1000) {
                return (count / 1000).toFixed(1) + 'K';
            }
            return count.toString();
        }

        function formatSubscribers(count) {
            if (!count) return '0';
            const num = parseInt(count);
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function formatDate(publishedAt) {
            const date = new Date(publishedAt);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Сегодня';
            if (diffDays === 1) return 'Вчера';
            if (diffDays < 7) return `${diffDays} дней назад`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} нед. назад`;
            return `${Math.floor(diffDays / 30)} мес. назад`;
        }

        // 🔐 АВТОРИЗАЦИЯ - ИСПРАВЛЕННАЯ ВЕРСИЯ (рабочая Google OAuth)
        function showAuthModal() {
            document.getElementById('authModal').style.display = 'block';
        }

        function hideAuthModal() {
            document.getElementById('authModal').style.display = 'none';
            clearAuthErrors();
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            document.querySelector(`.auth-tab[onclick="switchAuthTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            
            clearAuthErrors();
        }

        function clearAuthErrors() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        // 🔐 GOOGLE OAuth 2.0 АВТОРИЗАЦИЯ - РАБОЧАЯ ВЕРСИЯ
        function loginWithGoogle() {
            const scope = 'profile email';
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${OAUTH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(scope)}&prompt=select_account`;
            
            // Открываем в новом окне
            const width = 500;
            const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            
            window.open(authUrl, 'Google Login', `width=${width},height=${height},left=${left},top=${top}`);
            
            // Добавляем обработчик сообщений для OAuth
            window.addEventListener('message', handleOAuthMessage);
        }

        function handleOAuthMessage(event) {
            // Проверяем происхождение для безопасности
            if (event.origin !== window.location.origin) return;
            
            if (event.data.type === 'oauth_token') {
                const token = event.data.token;
                fetchUserInfo(token);
            }
        }

        function fetchUserInfo(token) {
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка получения данных');
                }
                return response.json();
            })
            .then(userInfo => {
                // Сохраняем данные пользователя
                currentUser = {
                    id: userInfo.sub,
                    name: userInfo.name,
                    email: userInfo.email,
                    picture: userInfo.picture
                };
                
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                // Обновляем UI
                updateAuthUI();
                
                // Скрываем модальное окно
                hideAuthModal();
                
                showNotification(`✅ Добро пожаловать, ${userInfo.name}!`);
            })
            .catch(error => {
                console.error('Ошибка получения данных пользователя:', error);
                showNotification('❌ Ошибка авторизации');
            });
        }

        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            
            if (currentUser) {
                authSection.innerHTML = `
                    <div class="user-profile" onclick="logout()">
                        <div class="user-avatar">
                            ${currentUser.picture ? 
                                `<img src="${currentUser.picture}" alt="${currentUser.name}">` : 
                                currentUser.name.charAt(0).toUpperCase()
                            }
                        </div>
                        <div class="user-name">${currentUser.name}</div>
                    </div>
                `;
            } else {
                authSection.innerHTML = `<button class="auth-btn" onclick="showAuthModal()">Войти</button>`;
            }
        }

        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                currentUser = null;
                localStorage.removeItem('currentUser');
                updateAuthUI();
                showNotification('👋 Вы вышли из системы');
            }
        }

        // Проверяем токен в URL при загрузке (для OAuth редиректа)
        function checkOAuthRedirect() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');
            
            if (token) {
                // Очищаем URL от токена
                window.history.replaceState({}, document.title, window.location.pathname);
                
                // Отправляем токен в основное окно через postMessage
                window.opener?.postMessage({
                    type: 'oauth_token',
                    token: token
                }, window.location.origin);
                
                // Закрываем окно OAuth
                setTimeout(() => {
                    window.close();
                }, 1000);
                
                return true;
            }
            return false;
        }

        // Остальные функции авторизации (для формы)
        function registerWithEmail() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const errorElement = document.getElementById('registerError');

            if (!email || !password || !name) {
                errorElement.textContent = 'Заполните все поля';
                return;
            }

            hideAuthModal();
            showNotification('✅ Для полной функциональности используйте Google вход');
        }

        function loginWithEmail() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorElement = document.getElementById('loginError');

            if (!email || !password) {
                errorElement.textContent = 'Заполните все поля';
                return;
            }

            hideAuthModal();
            showNotification('✅ Для полной функциональности используйте Google вход');
        }

        // Инициализация при загрузке
        window.addEventListener('load', function() {
            // Проверяем, является ли это окном OAuth редиректа
            if (checkOAuthRedirect()) {
                return;
            }
            
            // Проверяем существующую авторизацию
            updateAuthUI();
            
            // Основная инициализация
            switchMode('browser');
            
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
            
            // Добавляем обработчик для сообщений OAuth
            window.addEventListener('message', handleOAuthMessage);
            
            showNotification('🚀 Приложение загружено и готово к работе!');
        });
    </script>
</body>
</html>
